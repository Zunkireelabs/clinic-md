server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera/microphone are needed by the doctor consultation (recording, X-ray and clinical photos)
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static assets
    location /assets/ {

        # (add_header in a location replaces the server-level headers, so the security headers are repeated)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # camera/microphone are needed by the doctor consultation (recording, X-ray and clinical photos)
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon
    location = /favicon.ico {
        expires 30d;
        log_not_found off;
        access_log off;
    }

    # Never cache index.html — Vite uses content hashes for assets
    location = /index.html {

        # (add_header in a location replaces the server-level headers, so the security headers are repeated)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # camera/microphone are needed by the doctor consultation (recording, X-ray and clinical photos)
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Doctor phone pages are served from phone.html so the Home Screen app gets its own
    # name, icon and start address (see phone.html).
    location ~ ^/(phone|phone/pair|[^/.]+/phone)/?$ {

        # (add_header in a location replaces the server-level headers, so the security headers are repeated)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # camera/microphone are needed by the doctor consultation (recording, X-ray and clinical photos)
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /phone.html =404;
    }

    # SPA fallback - serve index.html for all routes
    location / {

        # (add_header in a location replaces the server-level headers, so the security headers are repeated)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # camera/microphone are needed by the doctor consultation (recording, X-ray and clinical photos)
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}

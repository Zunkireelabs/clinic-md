name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

  rls:
    name: Tenant isolation (RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Only the database: the test needs Postgres with Supabase's roles and auth schema, not GoTrue or the API.
      - run: supabase db start

      # The port comes from supabase/config.toml [db], so CI never hard-codes a number; no dependence on `supabase status`.
      - name: Local DB URL
        run: |
          port=$(awk '/^\[db\]/{d=1;next} /^\[/{d=0} d && /^port[ ]*=/{print $3; exit}' supabase/config.toml)
          test -n "$port"
          echo "RLS_DB_URL=postgresql://postgres:postgres@127.0.0.1:$port/postgres" >> "$GITHUB_ENV"

      - run: ./scripts/local-db-bootstrap.sh --no-users --db-url "$RLS_DB_URL"

      - run: npm run test:rls
